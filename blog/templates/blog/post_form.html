<!DOCTYPE html>
<html lang="en">
{% include 'blog/head.html' %}
<body>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
   <h5 class="my-0 mr-md-auto font-weight-normal">Blog</h5>
   <nav class="ms-5">
       <a class="p-2 btn btn-outline-primary" href="/">Главная</a>
       <a class="p-2 btn btn-outline-primary" href="/contact/">Контакты</a>
   </nav>
</div>

{% block content1 %}
<div class="container">
    <h2 class="mt-5">{% if view.object.pk %}Редактирование{% else %}Создание{% endif %} поста</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">{% if view.object.pk %}Обновить{% else %}Создать{% endif %} пост</button>
    </form>
</div>
{% endblock %}

{% block footer %}
{% include 'blog/footer.html' %}
{% endblock %}

<!-- Подключите статичеcкие файлы со скриптами Bootstrap -->
</body>
</html>
